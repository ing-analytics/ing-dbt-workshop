models:
  - name: stg_orders
    description: "Staging table for orders"
    data_tests:
      - column_a_smaller_than_column_b:
          arguments:
            column_a: subtotal
            column_b: order_total
    columns:
      - name: order_id
        description: "Primary key for the orders table"
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "Reference to the customer placing the order"
      - name: order_date
        description: "Date when the order was placed"
      - name: tax_paid_cents
        description: "Tax paid for the order in cents"
      - name: tax_paid
        description: "Tax paid for the order in dollars, converted from cents using a macro"   
